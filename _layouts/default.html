<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root { --bg:#fbfaf7; --fg:#1f2328; --muted:#6a737d; --line:#e4e1da; --accent:#b4532a; --code:#f2efe8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --line:#2e3238; --accent:#e8895c; --code:#22262c; } }
  body { background:var(--bg); color:var(--fg); font-family:'Noto Sans KR',sans-serif; line-height:1.8; word-break:keep-all; overflow-wrap:anywhere; margin:0; padding:40px 16px 96px; }
  main { max-width:820px; margin:0 auto; }
  h1 { font-size:1.75rem; line-height:1.4; border-bottom:2px solid var(--accent); padding-bottom:.4em; }
  h2 { margin-top:2.4em; color:var(--accent); }
  h3 { margin-top:1.8em; }
  a { color:var(--accent); }
  img { width:100%; max-width:100%; height:auto; display:block; margin:1.4em auto; }
  table { border-collapse:collapse; width:100%; font-size:.92rem; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:.5em .7em; vertical-align:top; }
  th { background:var(--code); }
  code { background:var(--code); border-radius:4px; padding:.1em .35em; font-size:.88em; }
  blockquote { border-left:4px solid var(--accent); margin:1.2em 0; padding:.2em 1em; color:var(--muted); }
  hr { border:0; border-top:1px solid var(--line); margin:2.4em 0; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
