<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mute" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<style>.bg{fill:#fbfaf7}.ink{fill:#1f2328}.mute{fill:#6a737d}.q{fill:#fff;stroke:#2a78d6;stroke-width:2}.o{fill:#fff;stroke:#e4e1da}.band{fill:#fdf1ea;stroke:#b4532a;stroke-width:1.5}.acc{fill:#b4532a}.ln{stroke:#9aa0a6;fill:none}.pill{fill:#eb6834}.pt{fill:#fff}.lb{fill:#fbfaf7}@media (prefers-color-scheme: dark){.bg{fill:#16181c}.ink{fill:#e6e6e6}.mute{fill:#9aa0a6}.q{fill:#1f2328;stroke:#3987e5}.o{fill:#1f2328;stroke:#2e3238}.band{fill:#2a1f1a;stroke:#e8895c}.acc{fill:#e8895c}.ln{stroke:#5f656d}.pill{fill:#d95926}.lb{fill:#16181c}}</style>
<rect class="bg" width="960" height="580" rx="14"/>
<text class="mute" x="40" y="38" font-size="13">구조를 언제 굳힐 것인가 — 질문 넷 (주황 태그 = 물음지기가 지나간 길)</text>
<rect class="q" x="40" y="62" width="400" height="64" rx="9"/>
<text class="ink" x="56" y="99.0" font-size="15" font-weight="700">Q1. 코드를 짜는 지금, 갈래를 전부 적을 수 있나?</text>
<rect class="q" x="520" y="62" width="400" height="64" rx="9"/>
<text class="ink" x="536" y="99.0" font-size="15" font-weight="700">Q2. 같은 자료에 질문이 수천 번 들어오나?</text>
<rect class="o" x="40" y="168" width="400" height="66" rx="9"/>
<text class="ink" x="56" y="194" font-size="15" font-weight="700">흐름을 코드에 박는다</text>
<text class="mute" x="56" y="215" font-size="12">체이닝 · 라우팅 · 병렬화 — 뉴스레터, 고객 응대</text>
<rect class="pill" x="280" y="178" width="148" height="22" rx="11"/>
<text class="pt" x="354.0" y="193.5" font-size="11.5" font-weight="700" text-anchor="middle">물음지기 · 의도 11종</text>
<rect class="o" x="520" y="168" width="400" height="66" rx="9"/>
<text class="ink" x="536" y="194" font-size="15" font-weight="700">미리 색인해 비용을 나눈다</text>
<text class="mute" x="536" y="215" font-size="12">GraphRAG — 영화 · 한국사 · 법령</text>
<rect class="pill" x="772" y="178" width="136" height="22" rx="11"/>
<text class="pt" x="840.0" y="193.5" font-size="11.5" font-weight="700" text-anchor="middle">물음지기 · 매일 배치</text>
<path class="ln" stroke-width="1.8" d="M240 126 V166" marker-end="url(#ah)"/>
<rect class="lb" x="227.0" y="137" width="26" height="18"/>
<text class="ink" x="240" y="150" font-size="12" font-weight="700" text-anchor="middle">예</text>
<path class="ln" stroke-width="1.8" d="M720 126 V166" marker-end="url(#ah)"/>
<rect class="lb" x="707.0" y="137" width="26" height="18"/>
<text class="ink" x="720" y="150" font-size="12" font-weight="700" text-anchor="middle">예</text>
<path class="ln" stroke-width="1.8" d="M440 94 H480 V282" marker-end="url(#ah)"/>
<path class="ln" stroke-width="1.8" d="M520 94 H480"/>
<rect class="lb" x="436" y="244" width="88" height="20"/>
<text class="ink" x="480" y="258" font-size="12" font-weight="700" text-anchor="middle">둘 다 아니오</text>
<rect class="q" x="280" y="284" width="400" height="64" rx="9"/>
<text class="ink" x="296" y="321.0" font-size="15" font-weight="700">Q3. 나눌 것이 실제로 나뉘어 있나?</text>
<rect class="o" x="40" y="390" width="400" height="66" rx="9"/>
<text class="ink" x="56" y="416" font-size="15" font-weight="700">한 명이면 된다</text>
<text class="mute" x="56" y="437" font-size="12">나누면 오히려 진다 (단일 질문: 팀 0.57 vs 혼자 0.69)</text>
<rect class="o" x="520" y="390" width="400" height="66" rx="9"/>
<text class="ink" x="536" y="416" font-size="15" font-weight="700">실행 중에 나눈다</text>
<text class="mute" x="536" y="437" font-size="12">오케스트레이터-워커 — 딥리서치</text>
<path class="ln" stroke-width="1.8" d="M280 316 H240 V388" marker-end="url(#ah)"/>
<rect class="lb" x="215.0" y="349" width="50" height="18"/>
<text class="ink" x="240" y="362" font-size="12" font-weight="700" text-anchor="middle">아니오</text>
<path class="ln" stroke-width="1.8" d="M680 316 H720 V388" marker-end="url(#ah)"/>
<rect class="lb" x="707.0" y="349" width="26" height="18"/>
<text class="ink" x="720" y="362" font-size="12" font-weight="700" text-anchor="middle">예</text>
<rect class="band" x="40" y="486" width="880" height="70" rx="9"/>
<text class="ink" x="56" y="512" font-size="15" font-weight="700">Q4. 어느 길이든 — 되돌릴 수 없는 결과가 있나?  →  그 앞에 멈춤 자리</text>
<text class="mute" x="56" y="533" font-size="12">결재 (재고 발주 HITL) · 이관 (고객 응대) · 되묻기 (물음지기: 확신 없으면 유사 질문 3개)</text>
<rect class="pill" x="796" y="496" width="112" height="22" rx="11"/>
<text class="pt" x="852.0" y="511.5" font-size="11.5" font-weight="700" text-anchor="middle">물음지기 · 되묻기</text>
</svg>